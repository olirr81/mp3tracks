name: Audio Stem Separation Pipeline

on:
  workflow_dispatch: # Permite ejecutarlo manualmente con un clic en GitHub

jobs:
  split-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "audio-separator[cpu]" demucs

      - name: Run Extraction Script
        run: |
          python runner.py

      - name: Upload Stems Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pistas_Separadas_Studio
          path: output/
